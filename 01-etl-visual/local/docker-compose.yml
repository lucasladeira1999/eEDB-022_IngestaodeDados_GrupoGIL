services:
  postgres:
    image: postgres:16-alpine
    container_name: atividade1-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      # lido pelo init.sh para criar o usuário do Hop
      ETL_PASSWORD: ${ETL_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Roda sozinho na primeira vez que o banco sobe: cria o banco glassdoor,
      # o usuário etl e os schemas raw/trusted.
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      # -h localhost força TCP: durante o init.sh a porta ainda está fechada,
      # então o healthcheck só passa quando o banco está de fato pronto.
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d glassdoor"]
      interval: 5s
      timeout: 5s
      retries: 10

  # GUI do Apache Hop no navegador: http://localhost:8080/ui
  hop:
    image: apache/hop-web:latest
    container_name: atividade1-hop
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      HOP_PROJECT_NAME: atividade1
      HOP_PROJECT_FOLDER: /project
      HOP_PROJECT_CONFIG_FILE_NAME: project-config.json
      HOP_ENVIRONMENT_NAME: dev
      HOP_ENVIRONMENT_CONFIG_FILE_NAME_PATHS: /project/dev-config.json
    volumes:
      - ./hop:/project
      - ../../dados:/files:ro

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: atividade1-pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"

volumes:
  pgdata:
