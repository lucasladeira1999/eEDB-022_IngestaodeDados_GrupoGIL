# Log do Spark (o log do nosso código é Python, não passa por aqui).
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# Ruído conhecido: o foreachBatch roda o lote numa thread comum, e o conector do
# Kafka avisa que prefere UninterruptibleThread. Inofensivo no nosso uso.
logger.kafkaconsumer.name = org.apache.spark.sql.kafka010.KafkaDataConsumer
logger.kafkaconsumer.level = error

# Avisos de configuração que já sabemos e aceitamos
logger.adminclient.name = org.apache.kafka.clients.admin.AdminClientConfig
logger.adminclient.level = error
logger.consumerconfig.name = org.apache.kafka.clients.consumer.ConsumerConfig
logger.consumerconfig.level = error
