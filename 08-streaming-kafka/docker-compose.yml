services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: atividade8-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # dois listeners: containers falam com kafka:19092, a sua máquina com localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      # cluster de um nó só
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # desligado de propósito: o tópico é criado pelo kafka-init, e assim um erro de
      # digitação no nome falha alto em vez de criar um tópico vazio em silêncio
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # cria o tópico e encerra. O consumidor espera ele terminar: o conector Kafka do
  # Spark usa o AdminClient pra listar partições, e esse caminho não cria tópico.
  kafka-init:
    image: apache/kafka:3.8.1
    container_name: atividade8-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
      --create --if-not-exists --topic ${KAFKA_TOPIC}
      --partitions ${KAFKA_PARTICOES} --replication-factor 1
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: atividade8-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ETL_PASSWORD: ${ETL_PASSWORD:?ETL_PASSWORD must be set}
      CADASTRO_SCHEMA: ${CADASTRO_SCHEMA}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # job de streaming: fica rodando, esperando mensagem chegar na fila
  consumidor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atividade8-consumidor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${POSTGRES_DB}
      PG_USER: etl
      PG_PASSWORD: ${ETL_PASSWORD:?ETL_PASSWORD must be set}
      CADASTRO_SCHEMA: ${CADASTRO_SCHEMA}
      CADASTRO_TABELA: ${CADASTRO_TABELA}
      LOCAL_DATA_DIR: /app/data
      JANELA_SEGUNDOS: ${JANELA_SEGUNDOS}
      FUZZY_SCORE_CUTOFF: ${FUZZY_SCORE_CUTOFF}
    ports:
      # Spark UI: a aba "Structured Streaming" mostra cada janela processada
      - "4040:4040"
    volumes:
      - ./data:/app/data
    profiles: ["job"]

  # tópico, partições e o conteúdo de cada mensagem publicada
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: atividade8-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8080:8080"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: atividade8-pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"

volumes:
  pgdata:
